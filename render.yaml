services:
  - type: web
    name: riqssi-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: riqssi-postgres
          property: connectionString
      - key: FRONTEND_URLS
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: riqssi-postgres
    databaseName: db_riqssi
    user: riqssi